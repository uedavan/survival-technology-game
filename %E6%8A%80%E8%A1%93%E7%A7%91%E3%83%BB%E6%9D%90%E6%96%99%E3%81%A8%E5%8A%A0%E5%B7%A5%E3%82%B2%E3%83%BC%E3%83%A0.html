<script>
'use strict';
/* 数値の並びは常に [安全性, 快適性, 資源, 時間, 体力]。 */

const QUESTIONS=[
 {title:'どこを探索する？',scene:'島の探索',icon:'🏝️',story:'砂浜には流木、森には木々、山の上には古い村が見える。嵐が来る前に、まず何を調べる？',opts:[
  {name:'海岸を探索する',desc:'流木やプラスチック片、金属片を集める。',d:[0,0,12,-8,-8],t:0,good:'流れ着いた材料を集められた。',bad:'海岸を歩き回るため時間と体力を使った。',lesson:'流木などの再利用では、傷みや汚れ、用途に合う強度を確かめる。'},
  {name:'森を探索する',desc:'木材や竹を探し、材料を確保する。',d:[0,0,14,-9,-9],t:0,good:'木材や竹などを多く見つけた。',bad:'足場の悪い森で時間と体力を使った。',lesson:'木材は木目の方向や含水状態で性質が変わる。'},
  {name:'村の跡地を探索する',desc:'古い教科書と「上田先生のメモ」を発見する。',d:[5,3,5,-5,-1],t:5,good:'メモに安全な作業と加工の注意点が書かれていた！',bad:'集められる材料の量は海岸や森より少なかった。',lesson:'作業前に知識や情報を集めることは、安全で適切な判断につながる。'}]},
 {title:'小屋の柱には何を使う？',scene:'柱の材料',icon:'🪵',story:'嵐に備えるには、小屋を支える柱が必要だ。材料の強さだけでなく、重さや加工のしやすさも考えよう。',opts:[

 {title:'屋根にはどの材料を使う？',scene:'屋根の材料',icon:'🏠',story:'柱の材料を決めた。次は雨と風から身を守る屋根。防水性と耐久性を比べよう。',opts:[

 {title:'どんな構造の小屋にする？',scene:'骨組みの構造',icon:'📐',story:'遠くの空が暗くなってきた。屋根を支える骨組みの形を選ぼう。',opts:[

  {name:'三角形の骨組み',desc:'形が変わりにくい構造にする。',d:[9,2,-7,-7,-6],t:3,good:'三角形は形が変わりにくい。',bad:'小屋の内部で使える空間が限られやすい。',lesson:'三角形は辺の長さが一定なら形が変わりにくい。'}]},
 {title:'小屋を作る前にどうする？',scene:'製作の準備',icon:'📝',story:'作業場の机には古い製作図が残されている。限られた材料をどう使う？',opts:[
  {name:'寸法入りの製作図を作る',desc:'寸法・形状・接合位置を確認する。',d:[5,3,-3,-7,-3],t:3,good:'寸法を確かめ、組立の準備が整った。',bad:'図面を作る時間は必要だった。',lesson:'製作図は形状や寸法など製作に必要な情報を示す。'},

 {title:'加工中、異常な音がしたら？',scene:'作業場の異変',icon:'⚠️',story:'工具と工作機械の特徴を確認した。帯のこ盤の作業中、突然「ガガガッ！」と異常な音がする。嵐は近い。どうする？',opts:[
  {name:'そのまま作業を続ける',desc:'少しの異音なら大丈夫だと考える。',d:[-12,-2,-5,-9,-6],t:0,good:'作業を急ごうとした。',bad:'異常を放置して危険が高まり、作業も遅れた。',lesson:'異常音がした機械は直ちに安全に停止し、使用を続けない。'},

 {title:'部材をどう接合する？',scene:'骨組みの組立',icon:'🔩',story:'風が強まってきた。加工した部材を組み立てよう。接合方法は丈夫さと作業量に影響する。',opts:[

 {title:'完成した小屋をどうする？',scene:'最初の夜',icon:'⛈️',story:'ついに小屋が完成！ 雨が降り始めた。生活を始める前に、最後の判断をしよう。',opts:[

  {name:'全体を検査して必要な部分を補修する',desc:'屋根・柱・接合部を点検し、問題箇所を直す。',d:[10,5,-4,-6,-4],t:3,good:'不具合を見つけ、必要な部分だけ改善した。',bad:'点検と補修に材料や時間を使った。',lesson:'評価・改善は、目的や条件に照らして製作品を確かめ、問題を直すこと。'},
  {name:'さらに補強材を追加する',desc:'検査より先に、柱や屋根を補強する。',d:[8,3,-10,-9,-8],t:1,good:'適切な場所の補強で強度を高められた。',bad:'必要性を確認せずに補強し、材料と時間を多く使った。',lesson:'補強は目的と問題箇所を確かめてから行うと合理的。'}]}
];

 ['🪚','両刃のこぎり','木材を手で切断する。片側が縦びき刃、反対側が横びき刃。','縦びきは木目に沿う方向、横びきは木目を横切る方向。','材料を固定し、刃の進む方向に手を置かない。'],

 ['🔨','げんのう','釘打ちなどに使う。','一般的に平らな面と少し丸い面がある。','柄の緩みを確かめ、指を打たない。'],
 ['🗜️','クランプ','材料を挟んで一時的に固定する。','切断・接着・組立時の仮固定などに便利。','固定状態を確認し、締め過ぎに注意する。'],
 ['🗜️','万力','作業台などに取り付け、材料を挟んで固定する。','ハンドルで口金を動かし、安定して保持する。','指を挟まず、材料を傷めないように固定する。'],
 ['⚙️','帯のこ盤','木材などを直線・曲線に切断する。','輪になった帯状の刃が連続して動く。','刃に手を近づけず、異音がしたら安全に停止する。'],
 ['🪚','糸のこ盤','細かな曲線や複雑な形を切断する。','細い刃が上下に往復する。','材料を安定させ、刃の進行方向に指を置かない。'],
 ['🔩','卓上ボール盤','材料に穴をあける。','回転するドリルを材料に下ろして加工する。','材料を確実に固定し、巻き込まれる物を近づけない。'],
 ['✨','ベルトサンダ','材料の表面や切断面を研磨する。','研磨ベルトが動いて表面を削る。','指をベルトに近づけず、材料を安定させる。']

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

const round=x=>Math.round(x);
function modifiers(q,opt,history){let d=QUESTIONS[q].opts[opt].d.slice(),bonus=0,notes=[];
 const pick=n=>history[n]?.opt;
 if((q===1||q===2)&&d[2]<0){let explore=pick(0);let material=q===1?opt:opt;
  if((explore===0&&((q===1&&material===1)||(q===2&&(material===1||material===2))))||(explore===1&&((q===1&&material===0)||(q===2&&material===0)))){d[2]=round(d[2]*.9);notes.push('探索で集めた材料を活用し、資源消費を軽減した。')}}
 if(q===6){let plan=pick(4),mult=plan===0?.8:plan===1?.9:1;d[2]=round(d[2]*mult);d[3]=round(d[3]*mult);if(mult<1)notes.push('Q5の設計準備により、資源と時間の消費を軽減した。');
  if(pick(3)===1&&opt===0){bonus=3;notes.push('筋交いのある構造と接合の計画が合い、技術点+3。')}
  if(pick(3)===2&&opt===2){bonus=2;notes.push('三角形の構造と加工・組立の計画を組み合わせ、技術点+2。')}}
 return {d,bonus,notes};}
function materialNote(history){let col=history[1]?.opt,roof=history[2]?.opt;let a=['木材の柱は水分・腐朽や木目方向を確認する。','金属の柱は腐食や接合部を確認する。','プラスチックの柱は変形・たわみを確認する。'][col]||'';let b=['木の屋根は継ぎ目の雨漏りを確認する。','金属屋根は重ね目と固定部を確認する。','シート屋根は風によるめくれや破れを確認する。'][roof]||'';return a+' '+b;}
function evaluate(history){let stats=INITIAL.slice(),tech=0;let h=[];
 history.forEach((item,q)=>{let m=modifiers(q,item.opt,h),o=QUESTIONS[q].opts[item.opt];stats=stats.map((v,i)=>clamp(v+m.d[i],0,100));tech+=o.t+m.bonus;h.push({opt:item.opt,d:m.d,bonus:m.bonus,notes:m.notes});});return {stats,tech,h};}
/* 3^8 = 6561通りを調べ、実際に到達可能な範囲で評価を正規化する。 */
let bounds=null;
function rawRating(res,b){const metrics=[res.tech,...res.stats],weights=[.50,.20,.10,.10,.05,.05];return metrics.reduce((sum,v,i)=>sum+weights[i]*(v-b.min[i])/Math.max(1,b.max[i]-b.min[i]),0)}
function calculateBounds(){let min=Array(6).fill(Infinity),max=Array(6).fill(-Infinity),records=[];
 for(let k=0;k<6561;k++){let n=k,choices=[];for(let i=0;i<8;i++){choices.push({opt:n%3});n=Math.floor(n/3)}let r=evaluate(choices),a=[r.tech,...r.stats];a.forEach((v,i)=>{min[i]=Math.min(min[i],v);max[i]=Math.max(max[i],v)});records.push(r)}
 let b={min,max},raw=records.map(r=>rawRating(r,b));b.low=Math.min(...raw);b.high=Math.max(...raw);return b;}
bounds=calculateBounds();
function percent(res){let raw=rawRating(res,bounds);return clamp(round(100*(raw-bounds.low)/Math.max(.001,bounds.high-bounds.low)),0,100)}
function grade(p){return p>=90?'S':p>=75?'A':p>=60?'B':p>=40?'C':'D'}
function statCards(stats){return `<div class="barrow">${stats.map((v,i)=>`<div class="stat"><span>${NAMES[i]}</span><strong>${v}</strong><meter min="0" max="100" value="${v}"></meter></div>`).join('')}</div>`}
function scene(label,icon,kind=''){return `<div class="scene ${kind}"><div class="scene-icon" aria-hidden="true">${icon}</div><div class="scene-text">${escapeHtml(label)}</div></div>`}
function render(){let html='';
 if(state.page==='welcome'){html=scene('漂流した島と、謎の作業場','🏝️')+`<div class="content"><span class="tag">STAGE 1｜材料と加工の技術</span><h1>技術科・材料と加工ゲーム</h1><p>家族旅行中、船が嵐に巻き込まれた。気がつくと、見知らぬ島の砂浜に倒れていた……。</p><p>材料の性質や安全な加工を考え、迫る嵐から身を守る小屋を完成させよう。</p><label for="nickname"><strong>プレイヤーのニックネーム</strong></label><input id="nickname" class="field" maxlength="20" autocomplete="off" placeholder="例：サバイバー" value="${escapeHtml(state.name)}"><p class="note">全8問・各3択／目安10〜15分／ログイン不要</p><div class="actions"><button class="primary" id="start">冒険を始める</button></div></div>`}
 if(state.page==='intro'){const chapters=[['遭難','🌊','激しい雨と波。船が大きく揺れた。目を覚ますと、あなたは砂浜にいた。家族の姿は見えず、スマートフォンは水没して動かない。'],['山の上の明かり','🏚️','島の高台に古い村が見える。誰もいないようなのに、建物の一つだけに明かりがついている。'],['謎の作業場','🔧','明かりの正体は太陽光発電と蓄電池だった。作業場には工具や工作機械が残されている。古い建物は傷み、今夜の寝床には危険だ。'],['迫る嵐','⛈️','作業場のラジオから途切れ途切れに声が流れる。「……今夜、強い風と雨が……」。日が暮れる前に小屋を作ろう！']];let c=chapters[state.intro];html=scene(c[0],c[1],state.intro===3?'storm':'')+`<div class="content"><span class="tag">PROLOGUE ${state.intro+1}/4</span><h2>${c[0]}</h2><p>${c[2]}</p><div class="actions"><button class="primary" id="introNext">${state.intro===3?'探索を始める':'次へ進む'}</button></div></div>`}
 if(state.page==='question'){let q=QUESTIONS[state.q];html=scene(q.scene,q.icon,state.q>=6?'storm':state.q===5?'workshop':'')+`<div class="content"><span class="tag">QUESTION ${state.q+1} / 8</span><div class="progress"><div style="width:${state.q/8*100}%"></div></div>${statCards(state.stats)}<p class="scoreline">技術的判断スコア：${state.tech} pt</p><h2>Q${state.q+1}｜${q.title}</h2><p>${q.story}</p><div class="choices">${q.opts.map((o,i)=>`<button class="choice ${state.selected===i?'selected':''}" data-choice="${i}" aria-pressed="${state.selected===i}"><strong>${'ABC'[i]}. ${o.name}</strong><span>${o.desc}</span></button>`).join('')}</div><p class="note">選択後にメリット・デメリットと数値の変化を確認できるよ。</p><div class="actions"><button class="primary" id="decide" ${state.selected===null?'disabled':''}>この選択で進む</button></div></div>`}
 if(state.page==='feedback'){let q=QUESTIONS[state.q],item=state.history[state.q],o=q.opts[item.opt],m=item.mod;html=scene('判断の結果',q.icon,state.q>=6?'storm':'')+`<div class="content"><span class="tag">Q${state.q+1} の結果</span><h2>${escapeHtml(o.name)}</h2><div class="notice"><strong>メリット</strong><br>${o.good}</div><div class="notice danger"><strong>デメリット</strong><br>${o.bad}</div><div class="resultbox"><h3>パラメータ変動</h3><div class="delta">${m.d.map((v,i)=>`<span class="${v>=0?'positive':'negative'}">${NAMES[i]} ${signed(v)}</span>`).join('')}</div><p class="scoreline">技術的判断スコア ${signed(o.t+m.bonus)} pt</p>${m.notes.map(s=>`<p class="small">🔗 ${s}</p>`).join('')}</div><div class="resultbox"><strong>📚 技術科のポイント</strong><p>${o.lesson}</p>${state.q===7?`<p>${materialNote(state.history)}</p>`:''}</div>${statCards(state.stats)}<div class="actions"><button class="primary" id="next">${state.q===4?'工具・工作機械を学ぶ':state.q===7?'結果を見る':'次へ進む'}</button></div></div>`}
 if(state.page==='tools'){html=scene('加工前に知っておこう','🛠️','workshop')+`<div class="content"><span class="tag">Q5とQ6の間｜学習パート</span><h2>工具・工作機械の特徴</h2><div class="notice"><strong>📣 重要！テストに出るよ！</strong><br>工具や機械の名前・用途・特徴を確認しよう。</div><p>この島の作業場には9種類の工具・機械が残されている。名前を覚えるだけでなく、何に使うのかを考えよう。</p><div class="grid">${TOOLS.map(t=>`<article class="tool"><div class="emoji">${t[0]}</div><h3>${t[1]}</h3><p><strong>用途：</strong>${t[2]}</p><p><strong>特徴：</strong>${t[3]}</p><small>⚠ 安全：${t[4]}</small></article>`).join('')}</div><div class="notice danger"><strong>安全上の注意</strong><br>このゲームは機械操作の練習ではありません。実際の工作機械は、先生などの適切な指導なしに操作しないでください。</div><div class="actions"><button class="primary" id="toolsNext">加工を始める（Q6へ）</button></div></div>`}
 if(state.page==='ending'){html=scene('嵐の夜を越えて','🌅','finish')+`<div class="content"><span class="tag">STAGE 1 CLEAR</span><h2>${escapeHtml(state.name)}、小屋が完成した！</h2><p>風が吹き、雨が屋根をたたく。あなたは自分で作った小屋で夜を越えた。</p><p>翌朝。作業場の奥から「ピッ……ピッ……」という音がする。</p><div class="notice"><strong>古い装置の画面：</strong><br>「食料備蓄、残りわずか」</div><p>次に必要なのは、食料を確保するための技術だ。</p><p><strong>NEXT STAGE｜生物育成の技術</strong></p><div class="actions"><button class="primary" id="endingNext">サバイバル結果を見る</button></div></div>`}
 if(state.page==='results'){let res=evaluate(state.history),p=percent(res),g=grade(p),best=state.best;html=scene('サバイバル結果発表','🏆','finish')+`<div class="content"><span class="tag">STAGE 1 CLEAR</span><h2>${escapeHtml(state.name)} の冒険結果</h2><div id="submitCapture"><div class="scorecard"><div class="small">総合評価</div><div class="grade">${g}</div><strong>達成率 ${p}%</strong><p>技術的判断スコア：<strong>${res.tech} pt</strong></p></div><h3>5つのパラメータ</h3>${statCards(res.stats)}<p class="small">選択履歴：${state.history.map((x,i)=>`Q${i+1}${'ABC'[x.opt]}`).join(' → ')}</p><p class="small">プレイヤー：${escapeHtml(state.name)}</p><p class="small">©2026 上田伴</p></div><p class="note">※評価は全選択パターンの到達可能な範囲をもとに正規化。技術50%、安全20%、快適10%、資源10%、時間5%、体力5%で計算。</p><div class="resultbox"><h3>🏅 この端末の最高記録</h3><p>${best?`<strong>${best.grade}評価・${best.percent}%</strong>／技術点 ${best.tech} pt（${escapeHtml(best.name)}）`:'まだ記録がありません。'}</p><p class="note">最高記録はこのブラウザ内に保存されます。別端末には引き継がれません。</p></div><section class="section"><h2>あなたの選択と学び</h2><div class="history">${state.history.map((x,i)=>{let o=QUESTIONS[i].opts[x.opt];return `<details><summary>Q${i+1}｜${QUESTIONS[i].title}：${o.name}</summary><p><strong>よかった点：</strong>${o.good}</p><p><strong>注意点：</strong>${o.bad}</p><p><strong>学習ポイント：</strong>${o.lesson}</p>${i===7?`<p>${materialNote(state.history)}</p>`:''}</details>`}).join('')}</div></section><section class="section"><h2>テスト対策｜重要語句</h2><div class="vocab">${VOCAB.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}</div></section><section class="section"><h2>工具・工作機械のおさらい</h2><div class="grid">${TOOLS.map(t=>`<div class="tool"><strong>${t[0]} ${t[1]}</strong><p>${t[2]}</p></div>`).join('')}</div></section><section class="section submission"><h2>📸 ロイロノートへ提出</h2><p>① 上の「サバイバル結果」部分をスクリーンショットする。<br>② 次の2つの問いに答える。<br>③ 画像と振り返りをロイロノートに提出する。</p><label for="reflection1"><strong>最も工夫した選択と、その理由</strong></label><textarea id="reflection1" placeholder="例：Q4で筋交いを選んだ。理由は…"></textarea><br><br><label for="reflection2"><strong>材料と加工の技術について学んだこと</strong></label><textarea id="reflection2" placeholder="例：材料によって強度や加工のしやすさが違うこと…"></textarea><div class="actions"><button class="secondary" id="copyReflection">振り返りをコピー</button><button class="secondary" id="printResult">結果を印刷・PDF保存</button></div><p class="note">ロイロノートへの送信は自動ではありません。スクリーンショットと文章を自分で提出してください。</p></section><div class="actions"><button class="primary" id="retry">もう一度挑戦する</button></div></div>`}
 app.innerHTML=html;wire();window.scrollTo({top:0,behavior:'instant'});
}
function saveBest(){let r=evaluate(state.history),p=percent(r),candidate={name:state.name,percent:p,grade:grade(p),tech:r.tech};if(!state.best||p>state.best.percent||(p===state.best.percent&&r.tech>state.best.tech)){state.best=candidate;try{localStorage.setItem(STORAGE,JSON.stringify(candidate))}catch(e){}}}
function wire(){const id=x=>document.getElementById(x);
 if(id('start'))id('start').onclick=()=>{state.name=(id('nickname').value.trim()||'サバイバー').slice(0,20);state.page='intro';state.intro=0;render()};
 if(id('introNext'))id('introNext').onclick=()=>{if(state.intro<3)state.intro++;else state.page='question';render()};
 document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{state.selected=Number(b.dataset.choice);document.querySelectorAll('[data-choice]').forEach(x=>{let yes=x===b;x.classList.toggle('selected',yes);x.setAttribute('aria-pressed',String(yes))});id('decide').disabled=false});
 if(id('decide'))id('decide').onclick=()=>{if(state.selected===null)return;let q=state.q,opt=state.selected,m=modifiers(q,opt,state.history),o=QUESTIONS[q].opts[opt];state.history.push({opt,mod:m});state.stats=state.stats.map((v,i)=>clamp(v+m.d[i],0,100));state.tech+=o.t+m.bonus;state.page='feedback';render()};
 if(id('next'))id('next').onclick=()=>{if(state.q===4){state.page='tools'}else if(state.q===7){state.page='ending'}else{state.q++;state.selected=null;state.page='question'}render()};
 if(id('toolsNext'))id('toolsNext').onclick=()=>{state.q=5;state.selected=null;state.page='question';render()};
 if(id('endingNext'))id('endingNext').onclick=()=>{saveBest();state.page='results';render()};
 if(id('retry'))id('retry').onclick=()=>{let best=state.best,name=state.name;state={page:'welcome',intro:0,name,q:0,selected:null,history:[],stats:INITIAL.slice(),tech:0,best};render()};
 if(id('copyReflection'))id('copyReflection').onclick=async()=>{let a=id('reflection1').value,b=id('reflection2').value,txt=`技術科・材料と加工ゲーム 振り返り\n最も工夫した選択と理由：${a}\n学んだこと：${b}`;try{await navigator.clipboard.writeText(txt);alert('振り返りをコピーしました。ロイロノートに貼り付けてください。')}catch(e){alert('コピーできませんでした。文章を選択してコピーしてください。')}};
 if(id('printResult'))id('printResult').onclick=()=>window.print();
}
render();
</script>
